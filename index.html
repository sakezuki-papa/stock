<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
/* Layout: スマホ前提の1カラム。上=タイトルと追加ボタン、中=場所ごとのリスト、下=固定タブ（在庫／買い物／履歴） */
:root {
  --bg: #EEF0EF;
  color-scheme: light;
  --surface: #FFFFFF;
  --surface-2: #F3F6F5;
  --fg: #17201F;
  --muted: #5B6967;
  --line: #E1E7E5;
  --accent: #1C5D72;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBEF;
  --out: #BE3E2B;
  --out-soft: #F8E2DD;
  --low: #A86A12;
  --low-soft: #F6EAD3;
  --ok: #2C7656;
  --ok-soft: #DDEFE5;
  --shadow: 0 0 0 1px rgba(20,40,40,.05), 0 2px 10px rgba(20,40,40,.06);
  --pop-yellow: #FFC83D;
  --pop-coral: #FF6B57;
  --f-logo: "Mochiy Pop One", "Hiragino Maru Gothic ProN", sans-serif;
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --g-low: #F1D69C;
  --g-out: #F2A193;
  --card-y: #FFF5CC;
  --card-y-line: #F0E2A6;
  --g-ok: #CDE3EA;
  --r: 14px;
  --nav-h: 62px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-logo); font-weight: 400; margin: 0; }
.logo .mark { width: 54px; height: 54px; flex: none; object-fit: contain; padding: 3px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #FFE27A, var(--pop-yellow)); border: 3px solid #fff;
  box-shadow: 0 0 0 2.5px #34403E, 3px 3px 0 2.5px #34403E; transform: rotate(-6deg); }
.logo .word { display: grid; justify-items: start; line-height: 1; gap: 3px; }
.logo .word small { font-family: var(--f-display); font-weight: 700; font-size: .72rem; letter-spacing: .12em; color: #fff;
  background: var(--pop-coral); border: 2px solid #34403E; border-radius: 999px; padding: 2px 9px 3px; transform: rotate(-3deg); margin-left: 4px; }
.logo .word .big { display: flex; font-size: 1.7rem; letter-spacing: .01em; }
.logo .word .big i { font-style: normal; -webkit-text-stroke: 5px #34403E; paint-order: stroke fill;
  text-shadow: 2px 3px 0 #34403E; display: inline-block; }
.logo .word .big i:nth-child(1) { color: var(--pop-coral); }
.logo .word .big i:nth-child(2) { color: var(--pop-yellow); }
.logo .word .big i:nth-child(3) { color: #4FB3E8; }
.logo .word .big i:nth-child(4) { color: #6CCB8C; }
.addbtn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; height: 44px; padding: 0 18px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.addbtn:disabled { opacity: .4; }
.hbtns { display: flex; align-items: center; gap: 8px; flex: none; }
.setbtn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); display: grid; place-items: center; padding: 0; }
.setbtn svg { width: 22px; height: 22px; }
.setbtn:disabled { opacity: .4; }

.banner { border-radius: var(--r); padding: 10px 14px; font-size: .9rem; background: var(--low-soft); }
.banner.info { background: var(--accent-soft); }
.search { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; font-size: 16px; line-height: 34px; }
.search::placeholder { font-size: 13px; }
.lead { margin: 0; font-size: .88rem; color: var(--muted); }

.group { display: grid; gap: 8px; }
.ghead { display: flex; align-items: center; gap: 8px; margin: 4px 4px 0; }
.ghead h2 { font-size: .95rem; margin: 0; font-weight: 700; }
.ghead .n { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { display: grid; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }

/* 品目行：1行目=名前と状態、2行目以降=操作 */
.row { display: grid; grid-template-columns: 5px 1fr; column-gap: 12px; row-gap: 10px; padding: 12px 14px 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.inline { grid-template-columns: 5px minmax(0, 1fr) auto; align-items: center; }
.row.inline .step { grid-column: 3; grid-row: 1; }
.row.inline .stripe { grid-row: 1; }
.stripe { grid-row: 1 / span 3; align-self: stretch; border-radius: 0 3px 3px 0; background: transparent; }
.row.out .stripe { background: var(--out); } .row.low .stripe { background: var(--low); } .row.open .stripe { background: var(--accent); }
.main { min-width: 0; display: grid; gap: 3px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.meta { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.pill { font-size: .75rem; padding: 1px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.pill.out { background: var(--out-soft); color: var(--out); }
.pill.low { background: var(--low-soft); color: var(--low); }
.pill.buy, .pill.open { background: var(--accent-soft); color: var(--accent); }
.pill.who { background: var(--ok-soft); color: var(--ok); }
.ctrl { grid-column: 2; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctrl .push { margin-left: auto; }
.step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.step button { width: 44px; height: 42px; border: 0; background: none; border-radius: 999px; font-size: 1.3rem; line-height: 1; }
.step button:disabled { opacity: .3; cursor: default; }
.num { min-width: 3.4em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
.num small { font-weight: 400; color: var(--muted); font-size: .75rem; margin-left: 1px; }
.cart { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.cart[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cart:disabled { cursor: default; }
.cart svg { width: 20px; height: 20px; }
.gauge { display: grid; grid-template-columns: repeat(4, 1fr); flex: 1 1 100%; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); padding: 3px; }
.gauge button { border: 0; background: none; border-radius: 999px; height: 38px; font-size: .92rem; color: var(--muted); }
.gauge button[aria-pressed="true"] { background: var(--ok); color: var(--surface); font-weight: 700; }
.row.low .gauge button[aria-pressed="true"] { background: var(--low); }
.row.out .gauge button[aria-pressed="true"], .row.open .gauge button[aria-pressed="true"] { background: var(--out); }
.spare { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; font-size: .95rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--out); border-color: var(--out); }
.btn.danger.armed { background: var(--out); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.grow { flex: 1; }
.buybox { grid-column: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.buybox label { font-size: .88rem; color: var(--muted); }

/* 買い物リスト：1品目1行。タップで操作を開く */
.srow { border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow.open { background: var(--surface-2); }
/* 行の背景＝残量ゲージ（切れ=空、わずか=黄1/4、それ以外=残量に応じた青） */
.sline { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; padding: 8px 16px; border: 0; text-align: left; background: none; }
.sline.low { --gc: var(--g-low); }
.sline.out { --gc: var(--g-out); }
.sline.out .samt { color: var(--out); font-weight: 700; }
.sline.low .samt { color: #C2560A; font-weight: 700; }
/* 買い物リスト：1品目ずつ白いカード（色を使わず、すき間で区切る） */
#shopList .list { background: none; box-shadow: none; border-radius: 0; overflow: visible; gap: 5px; }
#shopList .srow { background: var(--card-y); border: 1px solid var(--card-y-line); border-radius: 10px; box-shadow: 0 1px 2px rgba(20,40,40,.05); overflow: hidden; }
#shopList .srow:first-child { border-top: 1px solid var(--card-y-line); }
#shopList .srow.open { border-color: var(--accent); }
#shopList .srow.open .sline { background: none; }
.sline.ok, .sline.open { --gc: var(--g-ok); }
.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dot.out { background: var(--out); } .dot.low { background: var(--low); }
.sname { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sright { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 14px 12px 34px; }
.sact .meta { flex-basis: 100%; }
#shopList { gap: 10px !important; }
#shopList .group { gap: 4px; }
#shopList .ghead { margin: 0 4px; }
#shopList .ghead { margin: 2px 6px 0; gap: 6px; }
#shopList .ghead h2 { font-family: var(--f-logo); font-weight: 400; font-size: .64rem; letter-spacing: .08em; color: #1E6FD9;
  text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff, 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
#shopList .ghead .n { font-size: .64rem; color: var(--muted); }
#shopList .list { border-radius: 10px; }
#shopList .sline { min-height: 36px; padding: 5px 12px; }
.sleft { display: flex; align-items: center; gap: 6px; min-width: 0; }
.sicon { flex: none; font-size: 1.15rem; line-height: 1; }
#shopList .sname { font-family: var(--f-logo); font-weight: 400; font-size: .9rem; letter-spacing: .02em; }
/* 在庫画面も買い物リストと同じ字体にそろえる */
#stockList .ghead { margin: 2px 6px 0; gap: 6px; }
#stockList .ghead h2 { font-family: var(--f-logo); font-weight: 400; font-size: .64rem; letter-spacing: .08em; color: #1E6FD9;
  text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff, 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
#stockList .ghead .n { font-size: .64rem; color: var(--muted); }
#stockList .name { font-family: var(--f-logo); font-weight: 400; font-size: .92rem; letter-spacing: .02em; border: 1.5px solid #34403E; border-radius: 8px; padding: 2px 10px; background: var(--surface); line-height: 1.35; }
/* 在庫一覧をコンパクトに（機能は同じ） */
#stockList { gap: 10px !important; }
#stockList .group { gap: 4px; }
#stockList .list { border-radius: 10px; }
#stockList .row { padding: 7px 10px 7px 0; row-gap: 6px; column-gap: 10px; }
#stockList .main { gap: 1px; }
#stockList .meta { font-size: .72rem; }
#stockList .pill { font-size: .68rem; padding: 0 7px; }
#stockList .step button { width: 34px; height: 32px; font-size: 1.1rem; }
#stockList .num { min-width: 2.9em; font-size: .95rem; }
#stockList .gauge { padding: 2px; }
#stockList .gauge button { height: 28px; font-size: .82rem; }
#stockList .ctrl { gap: 8px; }
#stockList .spare { font-size: .78rem; gap: 6px; }
#stockList .btn { min-height: 34px; padding: 0 12px; font-size: .85rem; }
/* 量の品目：残量ボタンと予備を1行に */
#stockList .lvline { gap: 6px; }
#stockList .lvline .gauge { flex: 1 1 0; min-width: 0; }
#stockList .lvline .gauge button { padding: 0; font-size: .78rem; height: 30px; }
/* 残量ゲージ：選んだ段階まで色で塗り、選んだ文字だけ表示（他の段階は透明だが押せる） */
#stockList .gauge.lv { position: relative; isolation: isolate; overflow: hidden; }
#stockList .gauge.lv::before { content: ""; position: absolute; z-index: -1; left: 2px; top: 2px; bottom: 2px; width: calc(var(--fill) - 4px); border-radius: 999px; background: var(--gc); transition: width .2s ease, background-color .2s ease; }
#stockList .gauge.lv.has-spare { background: #EAF6FB; border-color: #D3ECF6; }
#stockList .gauge.lv.slider { align-items: center; min-height: 34px; touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none; }
#stockList .gauge.lv.slider .lab { text-align: center; font-size: .78rem; color: transparent; pointer-events: none; }
#stockList .gauge.lv.slider .lab.on { color: var(--fg); font-weight: 700; padding-right: 9px; }
#stockList .gauge.lv.slider::after { content: ""; position: absolute; z-index: -1; top: 50%; left: calc(var(--fill) - 7px); width: 4px; height: 16px; margin-top: -8px; border-radius: 3px; background: rgba(23,32,31,.28); transition: left .2s ease; }
#stockList .gauge.lv.slider.drag::before, #stockList .gauge.lv.slider.drag::after { transition: none; }
#stockList .gauge.lv.slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stockList .gauge.lv button[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
#stockList .lvline .spare { flex: none; gap: 4px; font-size: .74rem; }
/* 「開けた」が出る品目は、開けた・予備を小さくして1行に収める */
#stockList .lvline.has-open { flex-wrap: nowrap; gap: 4px; }
#stockList .has-open .spare { gap: 2px; font-size: .68rem; }
#stockList .has-open .step button { width: 26px; height: 28px; font-size: .95rem; }
#stockList .has-open .num { min-width: 2.2em; font-size: .82rem; }
#stockList .has-open .num small { font-size: .62rem; }
#stockList .has-open .openbtn { flex: none; min-height: 28px; padding: 0 7px; font-size: .72rem; border-radius: 8px; }
#shopList .sright { font-size: .74rem; }
#shopList .sright .pill { font-size: .68rem; padding: 0 7px; }
.log { display: grid; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.logrow { display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: .92rem; }
.logrow:first-child { border-top: 0; }
.loghead { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.loghead .log, .loghead .empty { box-shadow: none; border: 1px solid var(--line); }
.logrow time { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; padding-top: 2px; }
.logrow .d { color: var(--muted); font-size: .82rem; }

.empty { background: var(--surface); border-radius: var(--r); padding: 22px 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.empty h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; }
.empty p { margin: 0; color: var(--muted); font-size: .92rem; }

/* 下の固定タブ */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: .78rem; font-weight: 500; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--out); color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

.overlay { position: fixed; inset: 0; background: rgba(10,20,20,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .82rem; color: var(--muted); }
.field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; height: 46px; padding: 0 12px; font-size: 16px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg2 label { display: grid; place-items: center; height: 46px; font-size: .95rem; cursor: pointer; background: var(--surface-2); color: var(--muted); }
.seg2 input { position: absolute; opacity: 0; pointer-events: none; }
.seg2 label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg2 label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.modehint { font-size: .82rem; color: var(--muted); margin: 0; }
.sheetbtns { display: flex; gap: 10px; flex-wrap: wrap; }
.sheetbtns .right { display: flex; gap: 10px; margin-left: auto; }
.bulk { display: grid; gap: 16px; }
.bulk h4 { margin: 0 0 2px; font-size: .9rem; }
.brow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; min-height: 52px; border-top: 1px solid var(--line); }
.brow input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); }
.brow label { min-width: 0; }
.brow label small { color: var(--muted); margin-left: 6px; font-size: .75rem; }
.brow select, .brow input[type="number"] { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; height: 40px; padding: 0 8px; width: 7.8em; font-size: 16px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; z-index: 30; width: max-content; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>

<div class="app">

function change(it, data) {

  const wasNeed = needsBuy(it);
  pending[it.id] = { ...(pending[it.id] || {}), ...data };
  if (!wasNeed && needsBuy(it)) toast(`「${it.name}」を買い物リストに入れました`);
  render();

function describe(it, o, p) {
  const u = it.unit || '';

  const parts = [];

  if ('spare' in p && p.spare !== o.spare) parts.push(`予備 ${o.spare} → ${p.spare}${u}`);
  return parts.join('・') || '変更なし';
}
async function commit(it) {

  try {
    await enqueue(id, () => db.doc('items/' + id).update({ ...p, updatedAt: Date.now(), updatedBy: myId }));
    const opened = isLevel(it) && 'spare' in p && p.spare === o.spare - 1 && p.level === 3;

function levelSlider(it, cur, sp) {

    role: 'slider', tabindex: canWrite ? '0' : '-1', 'aria-label': it.name + 'の使用中の残量',
    'aria-valuemin': '0', 'aria-valuemax': '3', 'aria-valuenow': String(cur), 'aria-valuetext': LV_LONG[cur] },
    LV.map((lab, i) => h('span', { class: 'lab' + (i === cur ? ' on' : ''), 'aria-hidden': 'true' }, lab)));
  let v = cur, drag = false;
  const at = e => { const r = g.getBoundingClientRect(); return Math.max(0, Math.min(3, Math.floor((e.clientX - r.left) / r.width * 4))); };
  const show = n => {
    v = n; g.style.setProperty('--fill', (n + 1) * 25 + '%'); g.style.setProperty('--gc', LV_COLOR[n]);
    g.querySelectorAll('.lab').forEach((x, i) => x.classList.toggle('on', i === n));

  g.addEventListener('pointermove', e => { if (drag) show(at(e)); });

    h('button', { class: 'name', onclick: () => openSheet(it), title: '編集' }, it.name),
    statusPill(it),
    it.buyer ? h('span', { class: 'pill who' }, `${who(it.buyer)}が買う`) : null);
}
function stockRow(it) {
  const st = status(it);
  const main = h('div', { class: 'main' }, nameLine(it), it.memo ? h('div', { class: 'meta' }, it.memo) : null);
  if (!isLevel(it)) {
    const s = stockOf(it);
    return h('div', { class: 'row inline ' + st }, h('span', { class: 'stripe' }), main,
      h('div', { class: 'step' },
        h('button', { 'aria-label': it.name + 'を1減らす', disabled: !canWrite || s === 0, onclick: () => bump(it, -1) }, '−'),
        h('span', { class: 'num' }, s, h('small', {}, it.unit || '')),
        h('button', { 'aria-label': it.name + 'を1増やす', disabled: !canWrite, onclick: () => bump(it, 1) }, '+')));
  }
  const l = levelOf(it), sp = spareOf(it);
  return h('div', { class: 'row ' + st }, h('span', { class: 'stripe' }), main,
    h('div', { class: 'ctrl lvline' },
      levelSlider(it, l, sp),
      h('div', { class: 'spare' }, '予備',
        h('div', { class: 'step' },
          h('button', { 'aria-label': it.name + 'の予備を1つ開ける（残量が満になります）', disabled: !canWrite || sp === 0, onclick: () => openNew(it) }, '−'),
          h('span', { class: 'num' }, sp, h('small', {}, it.unit || '')),
          h('button', { 'aria-label': it.name + 'の予備を1増やす', disabled: !canWrite, onclick: () => bumpSpare(it, 1) }, '+')))));
}
function shortAmt(it) {
  return isLevel(it) ? `${LV_LONG[levelOf(it)]}・予備${spareOf(it)}` : `残り${stockOf(it)}`;
}
// ゲージの長さ（%）：切れ=0、わずか=25、量で管理は残量どおり、個数で管理は基準からの余裕で伸ばす
function fillPct(it) {
  const st = status(it);
  if (st === 'out') return 10;
  if (st === 'low') return 25;
  if (isLevel(it)) return [0, 25, 50, 100][levelOf(it)];
  const s = stockOf(it), m = minOf(it);
  return Math.round(Math.min(100, 25 + 75 * (s - m) / (m + 1)));
}
function shopRow(it) {
  const st = status(it), open = buying === it.id;
  const defQty = isLevel(it) ? 1 : Math.max(1, minOf(it) + 1 - stockOf(it));
  const line = h('button', { class: 'sline ' + st, style: `--fill:${fillPct(it)}%`, 'aria-expanded': String(open), onclick: () => { if (open) buying = null; else { buying = it.id; buyQty = defQty; } render(); } },
    h('span', { class: 'sleft' }, h('span', { class: 'sname' }, it.name), h('span', { class: 'sicon', 'aria-hidden': 'true' }, iconOf(it))),
    h('span', { class: 'sright' }, it.buyer ? h('span', { class: 'pill who' }, `${who(it.buyer)}が買う`) : null, h('span', { class: 'samt' }, shortAmt(it))));
  if (!open) return h('div', { class: 'srow' }, line);
  const manual = it.buy && st !== 'out' && st !== 'low';
  return h('div', { class: 'srow open' }, line,
    h('div', { class: 'sact' },
      it.memo ? h('div', { class: 'meta' }, it.memo) : null,
      h('div', { class: 'step' },
        h('button', { type: 'button', 'aria-label': '買った数を減らす', disabled: buyQty <= 1, onclick: () => { buyQty = Math.max(1, buyQty - 1); render(); } }, '−'),
        h('span', { class: 'num' }, buyQty, h('small', {}, it.unit || '')),
        h('button', { type: 'button', 'aria-label': '買った数を増やす', onclick: () => { buyQty++; render(); } }, '+')),
      h('button', { class: 'btn primary grow', disabled: !canWrite, onclick: () => purchase(it, buyQty) }, '買った'),
      h('button', { class: 'btn', disabled: !canWrite, onclick: () => claim(it) }, it.buyer === myId ? '担当をやめる' : '私が買う'),
      manual ? h('button', { class: 'btn', disabled: !canWrite, onclick: () => toggleBuy(it) }, '外す') : null));
}
const VERB = { buy: 'を買いました', count: 'を更新しました', open: 'の予備を開けました', add: 'を追加しました', edit: 'を編集しました', del: 'を削除しました' };
function logText(e) {
  if (e.kind === 'flag' || e.kind === 'claim') return `${who(e.by)}：「${e.item}」${e.detail}`;
  return `${who(e.by)}が「${e.item}」${VERB[e.kind] || ''}`;
}
const ORDER = { out: 0, low: 1, open: 2, ok: 3 };
function byCat(list) { return CATS.map(c => [c, list.filter(i => catOf(i) === c)]).filter(g => g[1].length); }
// 場所ごとの色（買い物リストの見出しに使う）
const CAT_COLOR = { 'キッチン': '#1C8A9E', '調味料他': '#E2593F', '冷蔵庫': '#2F8FCF', '食品': '#D08A1E', '洗面・バス': '#3D6FD8', 'トイレ': '#8A5CC7', '掃除・洗濯': '#2E9461', 'その他': '#7A8584' };
function groupBlock(title, note, rows) {
  return h('div', { class: 'group', style: `--cc:${CAT_COLOR[title] || '#7A8584'}` },
    h('div', { class: 'ghead' }, h('h2', {}, title), note ? h('span', { class: 'n' }, note) : null),
    h('div', { class: 'list' }, rows));
}

function render() {
  const sorted = [...items].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));
  const shop = sorted.filter(needsBuy).sort((a, b) => ORDER[status(a)] - ORDER[status(b)]);

  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  const badge = $('#badge'); badge.hidden = !shop.length; badge.textContent = shop.length;
  $('#view-stock').hidden = tab !== 'stock'; $('#view-shop').hidden = tab !== 'shop';
  $('#addBtn').disabled = !canWrite || !db;
  $('#setBtn').disabled = !db || !myId;

  const notes = [];
  if (noDb) notes.push(h('div', { class: 'banner' }, 'Firebase の設定がまだ入っていません。'));
  else if (noHome) notes.push(h('div', { class: 'banner' }, '家族用のURL（最後に #k=… が付いたURL）から開いてください。'));
  else if (dbErr) notes.push(h('div', { class: 'banner' }, 'データに接続できなくなりました。ページを開き直してください。'));
  else if (slow && !loaded) notes.push(h('div', { class: 'banner' }, 'データに接続できていません。通信状況を確認してください。'));
  else if (slow) notes.push(h('div', { class: 'banner' }, '表示が最新でない可能性があります。'));
  $('#notice').replaceChildren(...notes);

  // 在庫：場所ごと
  const sl = $('#stockList');
  $('#search').hidden = !items.length;
  if (!loaded) sl.replaceChildren(h('div', { class: 'empty' }, h('h3', {}, '読み込み中…'), h('p', {}, 'ふたりの在庫データを取得しています。')));
  else if (noHome || noDb) sl.replaceChildren();
  else if (!items.length) sl.replaceChildren(h('div', { class: 'empty' },
    h('h3', {}, 'まだ品目がありません'),
    h('p', {}, '調味料・日用品などよく使う品目から選んで登録できます。'),
    h('div', {}, h('button', { class: 'btn primary', disabled: !canWrite, onclick: openBulk }, 'よく使う品目から選ぶ'))));
  else {
    const q = query.trim();
    const list = q ? sorted.filter(i => i.name.includes(q) || (i.memo || '').includes(q)) : sorted;
    const groups = byCat(list);
    sl.replaceChildren(...(groups.length
      ? groups.map(([c, ls]) => groupBlock(c, null, ls.map(stockRow)))
      : [h('div', { class: 'empty' }, h('p', {}, '該当する品目がありません。'))]));
  }

  // 買い物：場所ごと
  const sh = $('#shopList');
  if (!loaded) sh.replaceChildren();
  else if (!shop.length) sh.replaceChildren(h('div', { class: 'empty' }, h('h3', {}, '今は買う物はありません'), h('p', {}, '補充の基準を下回った品目がここに並びます。')));
  else sh.replaceChildren(
    ...byCat(shop).map(([c, ls]) => groupBlock(c, null, ls.map(shopRow))));

  // 履歴
  const ll = $('#logList');
  if (!ll) return;
  if (!events.length) ll.replaceChildren(h('div', { class: 'empty' }, h('h3', {}, '履歴はまだありません'), h('p', {}, '購入・残量の変更・「私が買う」などの操作がここに記録され、パートナーにも見えます。')));
  else ll.replaceChildren(h('div', { class: 'log' }, events.map(e => h('div', { class: 'logrow' }, h('time', {}, ago(e.at)),
    h('div', {}, h('div', {}, logText(e)), ['buy', 'count', 'open'].includes(e.kind) ? h('div', { class: 'd' }, String(e.detail || '').replace(/未入力/g, '0')) : null)))));
}
function setTab(t) { tab = t; buying = null; render(); window.scrollTo({ top: 0 }); }
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#search').addEventListener('input', e => { query = e.target.value; render(); });
$('#addBtn').addEventListener('click', () => openSheet(null));
$('#setBtn').addEventListener('click', () => askName(true));

// ---------- 名前の登録（端末ごとに1回） ----------
function askName(edit) {
  if (!edit) { if (askedName) return; askedName = true; }
  const cur = (names[myId] && names[myId].name) || '';
  const inp = h('input', { id: 'f-me', maxlength: '12', placeholder: '例：パパ、ママ', autocomplete: 'off', value: cur });
  const form = h('form', { class: 'sheet', onsubmit: async e => {
    e.preventDefault();
    const name = inp.value.trim(); if (!name) { inp.focus(); return; }
    closeSheet();
    try { await db.doc('members/' + myId).set({ name, at: Date.now() }); toast(`呼び名を「${name}」にしました`); } catch (err) { if (!edit) askedName = false; fail(err); }
  } },
    h('h3', {}, edit ? '設定' : 'あなたの呼び名'),
    h('p', { class: 'modehint' }, '「○○が買いました」のように履歴に表示されます。'),
    h('div', { class: 'field full' }, h('label', { for: 'f-me' }, '呼び名'), inp),
    h('div', { class: 'sheetbtns' }, h('div', { class: 'right' }, edit ? h('button', { class: 'btn', type: 'button', onclick: closeSheet }, '閉じる') : null, h('button', { class: 'btn primary', type: 'submit' }, edit ? '保存する' : '登録する'))),
    edit ? h('div', { class: 'loghead' }, h('h3', {}, '履歴'), h('div', { id: 'logList' })) : null);
  const ov = h('div', { class: 'overlay', onclick: e => { if (edit && e.target === ov) closeSheet(); } }, form);
  $('#sheetRoot').replaceChildren(ov);
  if (edit) render(); else setTimeout(() => inp.focus(), 50);
}

// 家族ごとの合言葉：URL の #k=… を端末に覚えておく
function homeKey() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{20,})/);
  try { if (m) localStorage.setItem('homeKey', m[1]); return m ? m[1] : localStorage.getItem('homeKey'); }
  catch (e) { return m ? m[1] : null; }
}

// ---------- 新しい版が公開されていたら自動で読み直す ----------
const BUILD = '2026-11-02-8';
async function checkUpdate() {
  try {
    const t = await (await fetch('./?u=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + location.hash);
  } catch (e) {}
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
window.addEventListener('hashchange', () => { if (/k=/.test(location.hash)) location.reload(); });
render();
(async () => {
  const K = homeKey();
  if (!K) { noHome = true; loaded = true; render(); return; }
  if (!window.firebase || !FIREBASE_CONFIG.apiKey) { noDb = true; loaded = true; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  const timer = setTimeout(() => { slow = true; render(); }, 10000);
  try {
    const auth = firebase.auth();
    const cur = await new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });
    myId = (cur || (await auth.signInAnonymously()).user).uid;
  } catch (e) { clearTimeout(timer); dbErr = e; loaded = true; render(); return; }
  db = { collection: n => fs.collection(`homes/${K}/${n}`), doc: p => fs.doc(`homes/${K}/${p}`) };
  db.collection('items').onSnapshot({ includeMetadataChanges: true }, s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    if (!s.metadata.fromCache) { clearTimeout(timer); slow = false; }
    render();
  }, e => { clearTimeout(timer); dbErr = e; loaded = true; render(); });
  db.collection('events').orderBy('at', 'desc').limit(60).onSnapshot(s => {
    events = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => {});
  db.collection('members').onSnapshot(s => {
    names = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
    if (!s.metadata.fromCache && !names[myId]) askName();
    render();
  }, () => {});
  try {
    const old = await db.collection('events').where('at', '<', Date.now() - 90 * 864e5).limit(30).get();
    for (const d of old.docs) await db.doc('events/' + d.id).delete();
  } catch (e) {}
  setInterval(() => { if ($('#logList')) render(); }, 60000);
})();
</script>
